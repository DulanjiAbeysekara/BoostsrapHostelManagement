
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostel Management</title>
    <script src="assets/bootstrap-5.3.2-dist/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=PT+Mono&family=Yantramanav:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../bootstrap-5.3.2-dist/css/bootstrap.css">
    <script src="../bootstrap-5.3.2-dist/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="../hostel.css">
</head>
<body>
<div class="container-fluid">
    <div class="row flex-nowrap">
        <!-----------------------------------------------------header----------------------------------------------->
        <div class="bg-dark col-auto col-md-2 min-vh-100 w-25">
            <div class="bg-dark p-2">
                <a id="mainTopic" class="d-flex text-decoration-none mt-1 pt-1 align-items-center text-white">
                    <span class="fs-4 d-none d-sm-inline">Hostel Management</span>
                </a>
                <ul class="nav nav-pills flex-column mt-5">
                    <li id="subTopic" class="nav-item">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa fa-gauge"></i><span class="fs-5 ms-3 d-none d-sm-inline">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa-solid fa-house"></i><span class="fs-5 ms-3 d-none d-sm-inline">Home</span>
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa fa-users"></i><span class="fs-5 ms-3 d-none d-sm-inline">Student</span>
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa fa-door-open"></i><span class="fs-5 ms-3 d-none d-sm-inline">Rooms</span>
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa fa-calendar-days"></i><span class="fs-5 ms-3 d-none d-sm-inline">Reservation</span>
                        </a>
                    </li>
                    <li id="singIn" class="nav-item mt-5 pt-3">
                        <a href="#" class="nav-link text-white">
                            <i class="fs-5 fa fa-light fa-user"></i><span class="fs-5 ms-3 d-none d-sm-inline">Sign In</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <!---------------------------------------------------customer details--------------------------------------->
        <div class="col">
            <div class="row justify-content-center my-3">
                <div class="col-8  col-sm-6 col-md-10 col-lg-8 d-flex flex-column align-items-center">
                    <h2 id="customerDetails" class="mt-5">Customer Details</h2>
                    <div class="table-responsive mt-4 w-100">
                        <table class="table table-light table-striped table-bordered table-hover">
                            <thead class="text-light table-primary text-center table-bordered sticky-top">
                            <tr>
                                <th scope="col">Student Id</th>
                                <th scope="col">Student Name</th>
                                <th scope="col">Address</th>
                                <th scope="col">Contact No</th>
                                <th scope="col">Email</th>
                                <th scope="col">Gender</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
<!-------------------------------------------------------student btn--------------------------------->

    </div>
</div>
</body>
</html>
