<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Client Information Sheet</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="text-center mb-4">
        <img src="your-logo-url.png" alt="Your Company Logo">
        <h2>YourCompany</h2>
    </div>

    <div class="card">
        <div class="card-header text-center">
            Real Estate Client Information Sheet
        </div>

        <div class="card-body">
            <form>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="fileNumber">File Number</label>
                        <input type="text" class="form-control" id="fileNumber" placeholder="First Name">
                    </div>

                    <div class="form-group col-md-6">
                        <label for="clientSource">Client Source</label>
                        <select id="clientSource" class="form-control">
                            <option selected>Choose...</option>
                            <option>Source 1</option>
                            <option>Source 2</option>
                            <option>Source 3</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="agreedFee">Agreed Upon Fee</label>
                    <input type="text" class="form-control" id="agreedFee" placeholder="Fee Amount">
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="clientFirstName">Client Name</label>
                        <input type="text" class="form-control" id="clientFirstName" placeholder="First Name">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="clientLastName">&nbsp;</label>
                        <input type="text" class="form-control mt-2" id="clientLastName" placeholder="Last Name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="clientEmail">Client Email Address</label>
                    <input type="email" class="form-control" id="clientEmail" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <label for="clientPhone">Client Phone Number</label>
                    <input type="text" class="form-control" id="clientPhone" placeholder="Phone Number">
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
